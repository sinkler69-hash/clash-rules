name: Generate PAC

on:
  push:
    paths:
      - "rules.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate PAC
        run: |
          python generator.py

      - name: Commit PAC
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add universal.pac
          git commit -m "Auto update PAC" || echo "No changes"
          git push
