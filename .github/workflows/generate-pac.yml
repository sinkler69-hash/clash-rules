name: Generate PAC

on:
  push:
    paths:
      - rules.yaml
      - generator.py
  workflow_dispatch:

permissions:
  contents: write   # даём workflow право пушить в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0          # чтобы была нормальная ветка, а не detached HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run generator
        run: |
          python generator.py

      - name: Commit and push generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add clash-ruleset.yaml universal.pac || true

          # если нет изменений — выходим без ошибки
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update clash-ruleset and universal.pac"

          # Пушим именно в ту ветку, откуда пришёл пуш (обычно main)
          git push origin HEAD:${GITHUB_REF_NAME}
