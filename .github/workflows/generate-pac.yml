name: Generate Clash ruleset and PAC

on:
  push:
    paths:
      - rules.yaml
      - generator.py
  workflow_dispatch:

permissions:
  contents: write   # разрешаем GitHub Actions пушить в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run generator
        run: |
          python generator.py

      - name: Commit and push generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add clash-ruleset.yaml universal.pac || true

          # если изменений нет, коммит не нужен
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Auto-update clash-ruleset and universal.pac"
          git push
